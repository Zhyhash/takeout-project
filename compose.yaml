services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: takeout
      TZ: Asia/Shanghai
    command: ["--default-time-zone=+08:00"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    image: tokeout:0.0.1
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      JWT_SECRET: abc123def456ghi789jkl012mno345pq
      DB_URL: jdbc:mysql://mysql:3306/takeout?serverTimezone=Asia%2FShanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
