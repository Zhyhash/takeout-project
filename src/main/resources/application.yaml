spring:
  application:
    name: tokeout
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/takeout?serverTimezone=GMT%2B8
    username: root
    password: root

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

# JWT（单秘钥，用户/商家通过 role 区分）
jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
  expire-days: 7