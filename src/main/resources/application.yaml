spring:
  application:
    name: tokeout
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

# JWT（单秘钥，用户/商家通过 role 区分）
jwt:
  secret: ${JWT_SECRET}
  expire-days: 7
